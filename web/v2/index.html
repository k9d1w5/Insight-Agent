<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>IT 트렌드 브리핑</title>
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0e0e10" media="(prefers-color-scheme: dark)" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="/v2/style.css" />
  <script>
    try {
      const t = localStorage.getItem('v2-theme');
      if (t) document.documentElement.dataset.theme = t;
    } catch {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="/v2">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Insight<span class="brand-dim"> · ITCEN</span></span>
      </a>
      <nav class="topnav">
        <a href="#trends">트렌드</a>
        <a href="#topics">토픽</a>
        <a href="#feed">아티클</a>
      </nav>
      <button class="icon-btn" id="theme-btn" aria-label="테마 전환">
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <main class="wrap">
    <section class="hero" id="hero">
      <p class="eyebrow" id="hero-eyebrow">IT 트렌드 브리핑</p>
      <h1 id="hero-date">&nbsp;</h1>
      <p class="hero-sub" id="hero-sub">불러오는 중</p>
    </section>

    <section class="block" id="trends">
      <div class="block-head">
        <h2>이번 주 트렌드</h2>
        <p class="block-note">직전 4주 주평균 대비</p>
      </div>
      <div class="trend-grid" id="trend-grid">
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      </div>
      <div class="newkw hidden" id="newkw">
        <span class="newkw-label">새로 등장</span>
        <div class="newkw-list" id="newkw-list"></div>
      </div>
    </section>

    <section class="block" id="topics">
      <div class="block-head">
        <h2>토픽 전체</h2>
        <div class="seg" role="tablist" aria-label="정렬">
          <button class="seg-btn active" data-sort="score" role="tab" aria-selected="true">주목도</button>
          <button class="seg-btn" data-sort="count" role="tab" aria-selected="false">건수</button>
          <button class="seg-btn" data-sort="growth" role="tab" aria-selected="false">증가율</button>
        </div>
      </div>
      <div class="topic-table" id="topic-table"></div>
    </section>

    <section class="block" id="feed">
      <div class="block-head">
        <h2>이번 주 아티클</h2>
        <p class="block-note" id="feed-count"></p>
      </div>
      <div class="feed-tools">
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search" type="search" placeholder="제목, 출처로 검색" autocomplete="off" />
        </label>
        <div class="chips" id="feed-chips"></div>
      </div>
      <div id="feed-list"></div>
    </section>
  </main>

  <footer class="wrap footer">
    <span id="footer-meta"></span>
    <span>매일 오전 8시 업데이트 · <a href="/">이전 버전</a></span>
  </footer>

  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-labelledby="drawer-title">
    <div class="drawer-head">
      <h3 id="drawer-title"></h3>
      <button class="icon-btn" id="drawer-close" aria-label="닫기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/v2/app.js"></script>
</body>
</html>
