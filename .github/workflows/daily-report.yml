name: Daily IT Insight Report

on:
  schedule:
    # 매일 KST 오전 8시 = UTC 23:00 (전날)
    - cron: '0 23 * * *'
  workflow_dispatch:
    # 수동 실행 버튼 (테스트 시 사용)

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate insight report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py

      - name: Commit and push generated report
        run: |
          git config --local user.email "insight-bot@itcen.com"
          git config --local user.name "Insight Bot"
          git add web/data/
          git diff --staged --quiet || git commit -m "📊 리포트 자동 생성 - $(date +'%Y-%m-%d')"
          git push
