name: Daily IT Insight Report

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: studyMS
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate insight report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py

      - name: Commit and push generated report
        run: |
          git config --local user.email "insight-bot@itcen.com"
          git config --local user.name "Insight Bot"

          # 생성된 파일 임시 저장
          cp -r web/data/reports /tmp/reports_backup

          # 원격 최신 상태로 완전히 리셋
          git fetch origin
          git reset --hard origin/studyMS

          # 생성된 파일 복원
          mkdir -p web/data/reports
          cp -r /tmp/reports_backup/. web/data/reports/

          # 커밋 & 푸시
          git add web/data/
          git diff --staged --quiet || git commit -m "📊 리포트 자동 생성 - $(date +'%Y-%m-%d')"
          git push origin studyMS
